name: Android Debug APK Build & Deploy

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x Updates/gradlew

      - name: Build Debug APK
        run: |
          cd Updates
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Roohi-OS-Debug-APK
          path: Updates/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release (On Release Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Updates/app/build/outputs/apk/debug/app-debug.apk
          name: Roohi AI OS Layer Release ${{ github.ref_name }}
          body: |
            ## Roohi AI Assistant OS Layer - Android Native Runtime
            - **Build Variant:** Debug APK (`app-debug.apk`)
            - **Target SDK:** Android 34 (Android 14)
            - **Minimum SDK:** Android 26 (Android 8.0)
            - **Modules Included:** Modules A → Ω (Wake-word, Voice Auth, Accessibility Automation, Memory, Vision)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
