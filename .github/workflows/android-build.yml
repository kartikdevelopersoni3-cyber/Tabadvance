name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle Wrapper
        run: |
          if [ ! -f android-app/gradlew ]; then
            echo "ERROR: Gradle wrapper not found at android-app/gradlew"
            exit 1
          fi
          if [ ! -f android-app/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ERROR: gradle-wrapper.jar not found"
            exit 1
          fi
          echo "✓ Gradle wrapper validated successfully"

      - name: Grant execute permission to gradlew
        run: chmod +x android-app/gradlew

      - name: Setup Gradle build cache
        uses: gradle/gradle-build-action@v2
        with:
          gradle-home-cache-cleanup: true

      - name: Run Gradle clean
        run: cd android-app && ./gradlew clean
        continue-on-error: false

      - name: Assemble Debug APK
        run: cd android-app && ./gradlew assembleDebug
        continue-on-error: false

      - name: Build Release AAB
        run: cd android-app && ./gradlew bundleRelease
        continue-on-error: false

      - name: Locate generated artifacts
        run: |
          echo "=== APK Artifacts ==="
          find android-app -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
          echo ""
          echo "=== AAB Artifacts ==="
          find android-app -name "*.aab" -type f 2>/dev/null || echo "No AAB files found"
          echo ""
          echo "=== Build Output Directory ==="
          ls -la android-app/app/build/outputs/ 2>/dev/null || echo "Build outputs directory not found"

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release AAB
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: release-aab
          path: android-app/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Collect build logs on failure
        if: failure()
        run: |
          mkdir -p build-logs
          echo "=== Build Failure Diagnosis ===" > build-logs/build-failure.log
          echo "Timestamp: $(date)" >> build-logs/build-failure.log
          echo "" >> build-logs/build-failure.log
          echo "=== Gradle Build Output ===" >> build-logs/build-failure.log
          if [ -f android-app/build/reports/build.log ]; then
            cat android-app/build/reports/build.log >> build-logs/build-failure.log 2>/dev/null
          fi
          echo "" >> build-logs/build-failure.log
          echo "=== Java Version ===" >> build-logs/build-failure.log
          java -version >> build-logs/build-failure.log 2>&1
          echo "" >> build-logs/build-failure.log
          echo "=== Gradle Version ===" >> build-logs/build-failure.log
          cd android-app && ./gradlew --version >> ../../build-logs/build-failure.log 2>&1
          echo "" >> build-logs/build-failure.log
          echo "=== Directory Structure ===" >> build-logs/build-failure.log
          ls -la android-app/ >> build-logs/build-failure.log 2>&1
          ls -la android-app/app/ >> build-logs/build-failure.log 2>&1

      - name: Upload build failure logs
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: build-failure-logs
          path: build-logs/
          retention-days: 7

      - name: Build Summary
        if: always()
        run: |
          echo ""
          echo "╔════════════════════════════════════════════╗"
          echo "║        BUILD EXECUTION SUMMARY             ║"
          echo "╚════════════════════════════════════════════╝"
          echo ""
          echo "Repository: kartikdevelopersoni3-cyber/Tabadvance"
          echo "Branch: main"
          echo "Build Type: GitHub Actions (Ubuntu Latest)"
          echo "Java Version: 17 (Temurin)"
          echo "Gradle Wrapper: android-app/gradlew"
          echo "Gradle Version: 8.2"
          echo ""
          if [ $? -eq 0 ]; then
            echo "Status: ✅ BUILD SUCCESSFUL"
          else
            echo "Status: ❌ BUILD FAILED"
          fi
          echo ""
