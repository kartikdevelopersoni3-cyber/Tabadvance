workflows:
  android-debug-apk:
    name: Roohi AI OS - Android Debug APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
      ndk: r25b
    scripts:
      - name: Grant executable permission for gradlew
        script: chmod +x Updates/gradlew
      - name: Build Android Debug APK
        script: |
          cd Updates
          ./gradlew assembleDebug
    artifacts:
      - Updates/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - ritusoniji1983@gmail.com
        notify:
          success: true
          failure: true
